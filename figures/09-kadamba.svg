<svg viewBox="0 0 640 130" width="640" role="img" aria-label="15 bees: 3, 5, 6 and 1">
<g font-size="13" fill="var(--ink)" text-anchor="middle">
<rect x="20" y="40" width="120" height="38" rx="4" fill="var(--accent)"/><text x="80" y="30">1/5 kadamba = 3</text>
<rect x="140" y="40" width="200" height="38" rx="4" fill="var(--gold)"/><text x="240" y="30">1/3 śilīndhra = 5</text>
<rect x="340" y="40" width="240" height="38" rx="4" fill="var(--teal)"/><text x="460" y="30">3 × (5 − 3) kuṭaja = 6</text>
<rect x="580" y="40" width="40" height="38" rx="4" fill="var(--ok)"/><text x="600" y="30">1</text>
<text x="320" y="108" fill="var(--muted)">3 + 5 + 6 + 1 = 15 bees</text></g></svg>
