<svg viewBox="0 0 640 210" width="640" role="img" aria-label="Four streams with rates 1, 2, 3, 6 tanks per day, like parallel resistors">
<g font-size="14" fill="var(--ink)" text-anchor="middle">
<line x1="60" y1="40" x2="580" y2="40" stroke="var(--muted)" stroke-width="2"/><line x1="60" y1="160" x2="580" y2="160" stroke="var(--muted)" stroke-width="2"/>
<g stroke-width="10" stroke-linecap="round">
<line x1="140" y1="55" x2="140" y2="145" stroke="var(--teal)" opacity=".35"/><line x1="260" y1="55" x2="260" y2="145" stroke="var(--teal)" opacity=".55"/><line x1="380" y1="55" x2="380" y2="145" stroke="var(--teal)" opacity=".75"/><line x1="500" y1="55" x2="500" y2="145" stroke="var(--teal)"/></g>
<text x="140" y="104" fill="var(--surface)" font-size="12">.</text>
<text x="140" y="185">1 day → 1/day</text><text x="260" y="185">½ day → 2/day</text><text x="380" y="185">⅓ day → 3/day</text><text x="500" y="185">⅙ day → 6/day</text>
<text x="320" y="28" fill="var(--muted)">rates add, like conductances in parallel: 1 + 2 + 3 + 6 = 12 tanks a day → 2 hours</text></g></svg>
