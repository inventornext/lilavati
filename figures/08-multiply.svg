<svg viewBox="0 0 640 170" width="640" role="img" aria-label="Four ways to multiply 135 by 12">
<g font-size="15" fill="var(--ink)" text-anchor="middle">
<rect x="10" y="20" width="145" height="110" rx="10" fill="var(--accent-soft)"/><text x="82" y="46" fill="var(--accent)" font-weight="600">रूप · whole</text><text x="82" y="78">135 × 12</text><text x="82" y="108" font-weight="600">1620</text>
<rect x="165" y="20" width="145" height="110" rx="10" fill="var(--gold-soft)"/><text x="237" y="46" fill="var(--gold)" font-weight="600">स्थान · places</text><text x="237" y="72">1350</text><text x="237" y="92">+ 270</text><text x="237" y="116" font-weight="600">1620</text>
<rect x="320" y="20" width="145" height="110" rx="10" fill="var(--teal-soft)"/><text x="392" y="46" fill="var(--teal)" font-weight="600">विभाग · factors</text><text x="392" y="78">12 = 3 × 4</text><text x="392" y="108">405 × 4 = 1620</text>
<rect x="475" y="20" width="155" height="110" rx="10" fill="var(--surface-2)"/><text x="552" y="46" fill="var(--ink)" font-weight="600">खण्ड · parts</text><text x="552" y="78">12 = 8 + 4</text><text x="552" y="108">1080 + 540</text>
<text x="320" y="158" fill="var(--muted)" font-size="14">पञ्च-त्रि-एक → 135 (read right to left) · दिवाकर = 12</text></g></svg>
