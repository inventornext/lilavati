<svg viewBox="0 0 640 130" width="640" role="img" aria-label="30 pearls split into 10, 6, 5, 3 and 6">
<g font-size="13" fill="var(--ink)" text-anchor="middle">
<rect x="20" y="40" width="200" height="38" rx="4" fill="var(--accent)"/><text x="120" y="30">1/3 floor = 10</text>
<rect x="220" y="40" width="120" height="38" rx="4" fill="var(--gold)"/><text x="280" y="30">1/5 bed = 6</text>
<rect x="340" y="40" width="100" height="38" rx="4" fill="var(--teal)"/><text x="390" y="30">1/6 = 5</text>
<rect x="440" y="40" width="60" height="38" rx="4" fill="var(--muted)"/><text x="470" y="30">1/10 = 3</text>
<rect x="500" y="40" width="120" height="38" rx="4" fill="var(--ok)"/><text x="560" y="30">string = 6</text>
<text x="320" y="108" fill="var(--muted)">10 + 6 + 5 + 3 + 6 = 30 pearls</text></g></svg>
