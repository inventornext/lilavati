<rect x="34" y="65" width="12" height="135" fill="var(--muted)"/>
<circle cx="40" cy="58" r="8" fill="var(--indigo)"/>
<line x1="40" y1="65" x2="220" y2="200" stroke="var(--indigo)" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="220" y1="200" x2="445" y2="200" stroke="var(--saffron)" stroke-width="4"/>
<circle cx="445" cy="200" r="6" fill="var(--saffron)"/>
<circle cx="220" cy="200" r="6" fill="var(--ok)"/>
<text x="14" y="140" font-size="14" fill="var(--ink)">9</text>
